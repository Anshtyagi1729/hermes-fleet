[project]
name = "hermes-fleet-host"
version = "0.1.0"
description = "Control plane + OpenAI-compatible router for a Tailscale LLM fleet"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # httpx does async streaming properly, which is the whole reason the
    # router is async. requests cannot stream without blocking a thread.
    "httpx>=0.27",
    "jinja2>=3.1",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
